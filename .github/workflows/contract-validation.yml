name: Affilix Contract Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract-validation:
    name: Static contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical contracts
        run: python scripts/validate_contracts.py
      - name: Validate runtime orchestration contracts
        run: python scripts/validate_runtime_contract.py
      - name: Run Quote Content Stage 06–10 artifact integration tests
        run: python -m unittest tests/test_quote_content_artifacts.py -v
